<!-- @dsCard group="Brand" viewport="700x140" name="Brand · Mark & lockup" subtitle="Solid orange block + wordmark, two sizes" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-base);}
  .wrap{padding:18px 24px;display:flex;gap:56px;align-items:center;}
  .col{display:flex;align-items:center;gap:14px;}
  .mark{background:var(--orange);border-radius:5px;flex:none;}
  .mark.big{width:64px;height:40px;}
  .mark.sm{width:34px;height:30px;border-radius:4px;}
  .word .name{font-weight:700;color:var(--fg-bright);letter-spacing:1px;}
  .word .tag{color:var(--fg-muted);}
  .cap{font-size:11px;color:var(--fg-faint);margin-top:10px;}
  .inline{font-size:14px;color:var(--fg);}
  .inline b{color:var(--orange);}
</style></head>
<body class="tui">
  <div class="wrap">
    <div>
      <div class="col">
        <div class="mark big"></div>
        <div class="word"><div class="name" style="font-size:22px">cfdns</div><div class="tag" style="font-size:13px">Cloudflare DNS Console</div></div>
      </div>
      <div class="cap">header lockup — a plain 2-row orange block, not a drawn logo</div>
    </div>
    <div>
      <div class="col">
        <div class="mark sm"></div>
        <div class="word"><div class="name" style="font-size:14px">cfdns</div></div>
      </div>
      <div class="cap">compact mark · inline <span class="inline"><b>▟██▙</b> cfdns</span></div>
    </div>
  </div>
</body></html>
