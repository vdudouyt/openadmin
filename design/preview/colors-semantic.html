<!-- @dsCard group="Colors" viewport="700x190" name="Color · Semantic hues" subtitle="Desaturated green / red / blue / yellow / magenta" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-base);}
  .wrap{padding:18px 20px;font-size:14px;}
  .sw{display:flex;align-items:center;gap:14px;line-height:2.0;}
  .blk{font-family:var(--font-mono);font-size:20px;letter-spacing:-1px;}
  .tok{width:90px;display:inline-block;color:var(--fg);}
  .hex{color:var(--fg-muted);width:80px;display:inline-block;}
  .desc{color:var(--fg-faint);}
</style></head>
<body class="tui">
  <div class="wrap">
    <div class="sw"><span class="blk" style="color:#6cc08b">███</span><span class="tok">--green</span><span class="hex">#6cc08b</span><span class="desc">success · saved · healthy · ✓</span></div>
    <div class="sw"><span class="blk" style="color:#e0584f">███</span><span class="tok">--red</span><span class="hex">#e0584f</span><span class="desc">destructive · errors · delete · ×</span></div>
    <div class="sw"><span class="blk" style="color:#5b9bc7">███</span><span class="tok">--blue</span><span class="hex">#5b9bc7</span><span class="desc">record-type accent · informational</span></div>
    <div class="sw"><span class="blk" style="color:#d6a23e">███</span><span class="tok">--yellow</span><span class="hex">#d6a23e</span><span class="desc">warning · pending · TTL emphasis</span></div>
    <div class="sw"><span class="blk" style="color:#b888c9">███</span><span class="tok">--magenta</span><span class="hex">#b888c9</span><span class="desc">rare — MX/SRV priority fields</span></div>
  </div>
</body></html>
