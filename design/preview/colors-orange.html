<!-- @dsCard group="Colors" viewport="700x175" name="Color · Cloudflare orange" subtitle="The single accent + on-orange ink" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-base);}
  .wrap{padding:18px 20px;font-size:14px;}
  .sw{display:flex;align-items:center;gap:14px;line-height:2.05;}
  .blk{font-family:var(--font-mono);font-size:20px;letter-spacing:-1px;}
  .tok{width:150px;display:inline-block;color:var(--fg);}
  .hex{color:var(--fg-muted);width:80px;display:inline-block;}
  .desc{color:var(--fg-faint);}
</style></head>
<body class="tui">
  <div class="wrap">
    <div class="sw"><span class="blk" style="color:#f6821f">████</span><span class="tok">--orange</span><span class="hex">#f6821f</span><span class="desc">primary accent — proxied · focus · keys · logo</span></div>
    <div class="sw"><span class="blk" style="color:#fbad41">████</span><span class="tok">--orange-bright</span><span class="hex">#fbad41</span><span class="desc">hover / highlight on orange</span></div>
    <div class="sw"><span class="blk" style="color:#a85816">████</span><span class="tok">--orange-dim</span><span class="hex">#a85816</span><span class="desc">pressed · modal border · on-orange edges</span></div>
    <div class="sw" style="margin-top:6px"><span class="blk" style="color:#1a1200;background:#f6821f;padding:0 4px">Aa</span><span class="tok">--orange-ink</span><span class="hex">#1a1200</span><span class="desc">text drawn ON an orange fill</span></div>
  </div>
</body></html>
