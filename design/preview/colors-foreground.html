<!-- @dsCard group="Colors" viewport="700x190" name="Color · Foreground (dim white)" subtitle="Stepped dim-white text — never pure #fff" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-base);}
  .wrap{padding:18px 20px;font-size:14px;}
  .sw{display:flex;align-items:center;gap:14px;line-height:2.0;}
  .blk{font-family:var(--font-mono);font-size:20px;letter-spacing:-1px;}
  .tok{width:130px;display:inline-block;}
  .hex{color:var(--fg-muted);width:80px;display:inline-block;}
  .desc{color:var(--fg-faint);}
  .samp{margin-left:6px;}
</style></head>
<body class="tui">
  <div class="wrap">
    <div class="sw"><span class="blk" style="color:#e6e6e8">███</span><span class="tok" style="color:#e6e6e8">--fg-bright</span><span class="hex">#e6e6e8</span><span class="desc samp" style="color:#e6e6e8">logo · focused selection · key caps</span></div>
    <div class="sw"><span class="blk" style="color:#c2c2c6">███</span><span class="tok" style="color:#c2c2c6">--fg</span><span class="hex">#c2c2c6</span><span class="desc samp" style="color:#c2c2c6">default body text — dim white</span></div>
    <div class="sw"><span class="blk" style="color:#8b8b92">███</span><span class="tok" style="color:#8b8b92">--fg-muted</span><span class="hex">#8b8b92</span><span class="desc samp" style="color:#8b8b92">secondary — TTL · meta · subtitles</span></div>
    <div class="sw"><span class="blk" style="color:#5c5c63">███</span><span class="tok" style="color:#5c5c63">--fg-faint</span><span class="hex">#5c5c63</span><span class="desc samp" style="color:#5c5c63">tertiary — hints · separators</span></div>
    <div class="sw"><span class="blk" style="color:#3f3f45">███</span><span class="tok" style="color:#3f3f45">--fg-disabled</span><span class="hex">#3f3f45</span><span class="desc samp" style="color:#3f3f45">disabled glyphs</span></div>
  </div>
</body></html>
