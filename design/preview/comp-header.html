<!-- @dsCard group="Components" viewport="700x130" name="Component · Header & banner" subtitle="Brand block + wordmark + zone selector" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-base);}
  .wrap{padding:16px 20px;}
  .hdr{display:flex;align-items:center;justify-content:space-between;}
  .left{display:flex;align-items:center;gap:14px;}
  .mark{width:64px;height:40px;border-radius:5px;background:var(--orange);flex:none;}
  .word .name{font-size:20px;font-weight:700;color:var(--fg-bright);letter-spacing:1px;}
  .word .tag{font-size:12px;color:var(--fg-muted);}
  .right{text-align:right;font-size:13px;}
  .right .zone{color:var(--fg);}
  .right .zone b{color:var(--orange);font-weight:400;}
  .right .acct{color:var(--fg-faint);font-size:12px;}
  .rule{margin-top:12px;color:var(--line);white-space:pre;font-size:13px;letter-spacing:0;overflow:hidden;}
</style></head>
<body class="tui">
  <div class="wrap">
    <div class="hdr">
      <div class="left">
        <div class="mark"></div>
        <div class="word"><div class="name">cfdns</div><div class="tag">Cloudflare DNS Console</div></div>
      </div>
      <div class="right">
        <div class="zone">zone <b>mydomain.com</b> ▾</div>
        <div class="acct">ops@mydomain.com · Free plan</div>
      </div>
    </div>
    <div class="rule">────────────────────────────────────────────────────────────────────────────────────</div>
  </div>
</body></html>
