<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden;}
  .tile{display:flex;width:1280px;height:854px;}
  .main{flex:1;background:var(--orange);display:flex;align-items:center;justify-content:center;}
  .name{font-family:var(--font-mono);font-weight:700;font-size:210px;letter-spacing:-4px;color:#1a1200;line-height:1;}
  .strip{width:320px;display:flex;flex-direction:column;}
  .strip span{flex:1;display:block;}
</style></head>
<body>
  <div class="tile">
    <div class="main"><div class="name">cfdns</div></div>
    <div class="strip">
      <span style="background:#e8c45a"></span>
      <span style="background:#6cc08b"></span>
      <span style="background:#5b9bc7"></span>
      <span style="background:#e0584f"></span>
    </div>
  </div>
</body></html>
